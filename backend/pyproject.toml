[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slopshots-backend"
version = "1.0.0"
description = "File-backed FastAPI pipeline service for SlopShots"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111,<1",
  "python-multipart>=0.0.9,<1",
  "pydantic>=2.7,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "httpx>=0.27,<1",
]
integrations = [
  "kokoro>=0.9",
  "numpy>=1.26",
  "soundfile>=0.12",
  "whisperx>=3.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
